<h2 mat-dialog-title>{{ data.title ?? defaultTitle }}</h2>

<mat-dialog-content>
  @for (line of data.content; track $index) {
    <p>{{ line }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button (click)="close(false)" data-cy="cancel">{{ data.actions?.cancel ?? defaultActions.cancel }}</button>
  <button mat-flat-button (click)="close(true)" color="primary" data-cy="confirm">{{ data.actions?.confirm ?? defaultActions.confirm }}</button>
</mat-dialog-actions>
