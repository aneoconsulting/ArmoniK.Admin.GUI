upstream oidc {
  server oidc:9400;
}

server {
    listen 1080;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    
    auth_request /auth;
    auth_request_set $auth_status $upstream_status;

    location = /auth {
      internal;
      proxy_pass https://oidcmock.dev/oauth/userinfo;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    error_page 401 = @error401;

    location @error401 {
      return 302 https://oidcmock.dev/oauth/authorize?client_id=foo&response_type=id_token&redirect_uri=http://localhost:8080/admin/en/;
    }

    location /admin/en {
      try_files $uri $uri/ /admin/en/index.html;
    }

    location /admin/fr {
      try_files $uri $uri/ /admin/fr/index.html;
    }
}
